name: model-sizes
on: workflow_dispatch
jobs:
  sizes:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for m in HuggingFaceTB/SmolLM2-135M-Instruct Xenova/all-MiniLM-L6-v2 Xenova/bge-small-en-v1.5 Xenova/paraphrase-MiniLM-L3-v2 Xenova/bge-micro-v2 TaylorAI/bge-micro-v2; do
            echo "== $m"; curl -fsS "https://huggingface.co/api/models/$m/tree/main/onnx" | jq -r '.[]|"\(.path) \((.size/1048576|floor))MB"' || echo missing
          done
