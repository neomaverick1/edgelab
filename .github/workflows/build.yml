name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 22 * * 1-5' # after the US close: refresh the web snapshot of stocks, ETFs, forex and futures
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Put the built-in AI model (and a smaller one to compare) in place for its test
        run: bash scripts/fetch-ai-model.sh && bash scripts/fetch-ai-model.sh Xenova/all-MiniLM-L6-v2
      - run: npm test

  web:
    needs: [checks, android]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the market snapshot for the web version
        run: npm run data
      - name: Put the built-in AI model in the app
        run: bash scripts/fetch-ai-model.sh
      - run: npm run build
      - name: Get the APK from this build
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - run: rm -f dist/Edgelab-Play.aab
      - name: Or the latest released APK (scheduled data refreshes)
        if: needs.android.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern Edgelab.apk --dir dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Put the built-in AI model in the app
        run: bash scripts/fetch-ai-model.sh
      - name: Build the web app and copy it into the Android project
        run: npm run android
      - name: Build the phone APK (demo key, so each build installs over the last)
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Edgelab.apk
      - name: Play upload key from secrets
        env:
          UPLOAD_JKS_B64: ${{ secrets.UPLOAD_JKS_B64 }}
        run: |
          if [ -n "$UPLOAD_JKS_B64" ]; then echo "$UPLOAD_JKS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Build the Google Play bundle
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: ./gradlew bundleRelease --no-daemon
      - run: cp android/app/build/outputs/bundle/release/app-release.aab Edgelab-Play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Edgelab.apk
            Edgelab-Play.aab

  ios:
    needs: checks
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Put the built-in AI model in the app
        run: bash scripts/fetch-ai-model.sh
      - name: Build the web app and copy it into the iOS project
        run: npm run ios
      - name: Build the iOS app (simulator, unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Edgelab-iOS-Simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Edgelab-iOS-Simulator.zip

  release:
    needs: [android, ios, deploy-web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
      - uses: actions/download-artifact@v4
        with:
          name: ios
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Edgelab 2.0.${{ github.run_number }}
          make_latest: true
          files: |
            Edgelab.apk
            Edgelab-Play.aab
            Edgelab-iOS-Simulator.zip
          body: |
            **Android:** download `Edgelab.apk` on an Android phone and open it to install (allow installs from this source when asked). The app loads any stock, ETF, index, forex pair, future or crypto pair live on every timeframe.

            **iPhone and iPad:** open the web link below in Safari, tap Share, then Add to Home Screen. It installs as a full-screen app with its own icon and works offline. `Edgelab-iOS-Simulator.zip` is the native iOS build for the Xcode simulator (an App Store build needs an Apple Developer account).

            **Web:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (every Coinbase and Binance pair live, plus a daily snapshot of 200 popular markets).
