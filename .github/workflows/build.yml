name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 22 * * 1-5' # after the US close: refresh the web snapshot of stocks, ETFs, forex and futures
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  web:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the market snapshot for the web version
        run: npm run data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build the web app and copy it into the Android project
        run: npm run android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Edgelab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Edgelab.apk

  release:
    needs: [android, deploy-web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Edgelab 2.0.${{ github.run_number }}
          make_latest: true
          files: Edgelab.apk
          body: |
            **Android:** download `Edgelab.apk` on an Android phone and open it to install (allow installs from this source when asked). The app loads any stock, ETF, index, forex pair, future or crypto pair live on every timeframe.

            **Web:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (every Coinbase and Binance pair live, plus a daily snapshot of 200 popular markets).
